<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的第一个网站</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
    }

    .card {
      width: 80%;
      max-width: 600px;
      padding: 50px;
      text-align: center;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
    }

    h1 {
      font-size: 42px;
    }

    p {
      font-size: 18px;
      line-height: 1.8;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>你好，GitHub Pages！</h1>
    <p>这是我部署的第一个静态网页。</p>
  </div>
</body>
</html>
